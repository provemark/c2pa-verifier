# The same command as locally, on the three PHP versions the package
# promises. Nothing here reaches outside the repository except Composer's
# own package downloads: no service, no extension, no binary. So there is no
# non-blocking job and no continue-on-error — a red job is a red run.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: composer check (PHP ${{ matrix.php }})
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from 2026-10-19,
    # and a runner change should be a commit of its own, measured, not a
    # surprise in the middle of a release. PHP itself comes from setup-php.
    runs-on: ubuntu-24.04
    strategy:
      # Let every version finish: one red version must not hide another.
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          # SPEC-023 AC3 archives the commit before .gitattributes was added, to
          # show the criterion fires on the 62.9 MB dist that really shipped then.
          # A depth-1 checkout has no such commit and the test skips itself.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, sodium
          coverage: none

      - run: composer validate --strict

      # Composer's download cache, keyed on composer.json and the PHP version:
      # a package is fetched from Packagist once per version, not once per
      # job. Without it every run counted as three downloads of every
      # dependency on Packagist's statistics — measured 2026-09-21, when the
      # sister library's counter started moving on our CI alone. The cache
      # holds archives only; `composer install` below still resolves fresh.
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      # composer.lock is not committed (this is a library), so this installs
      # the newest versions inside the constraints — what a consumer gets.
      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer check

      # The same suite again, in parallel workers. It is not about speed here:
      # `composer check` runs serially, and a serial run loads every test file
      # into one process, so a helper declared in one file and used from
      # another works and the coupling never shows. A parallel worker gets a
      # subset and dies on the declaration it never saw. That is how nine such
      # declarations accumulated unnoticed until step 105, with the suite green
      # on every push. Three seconds a version keeps the property.
      - run: composer test:parallel

  # One job for a branch protection rule to hang on. It succeeds only when
  # every matrix leg succeeded; a skipped or cancelled leg is not success.
  all-green:
    name: all green
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test "${{ needs.check.result }}" = "success" || { echo "check: ${{ needs.check.result }}"; exit 1; }
